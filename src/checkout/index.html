<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="checkout-divider">
      <!-- Section 1: Order Information Soft Box Card -->
      <section class="checkout-products">
        <h2>Review & Place your Order</h2>
        <div class="checkout-product-list-wrapper">
          <div class="checkout-product-list-header-row">
            <span>Name</span>
            <span>Price</span>
            <span>Quantity</span>
            <span>Subtotal</span>
          </div>
          <ul class="checkout-product-list">
            <!-- Live target injection layer container for cloned template instances -->
          </ul>
          <!-- Reusable HTML5 Element Template Blueprint -->
          <template id="checkout-product-item-template">
            <li class="checkout-product-item">
              <span class="product-name"></span>
              <span class="item-price"></span>
              <span class="item-quantity"></span>
              <span class="item-subtotal"></span>
            </li>
          </template>
        </div>
        <!-- Financial Breakdown Ledger -->
        <div class="checkout-summary">
          <!-- Single Accounting Divider Line applies right above this paragraph block -->
          <p class="summary-row subtotal-row">
            <span class="label">Subtotal:</span>
            <span id="checkout-subtotal">$0.00</span>
          </p>
          <p class="summary-row">
            <span class="label">Tax (6%):</span>
            <span id="checkout-tax">$0.00</span>
          </p>
          <p class="summary-row">
            <span class="label">Shipping Estimate:</span>
            <span id="checkout-shipping">$0.00</span>
          </p>
          <!-- Double Accounting Divider Line applies right above this total paragraph block -->
          <p class="summary-row total-row">
            <span class="label">Total:</span>
            <span id="checkout-total">$0.00</span>
          </p>
        </div>
      </section>
      <!-- Section 2: Customer Information Soft Box Card -->
      <section class="customer-information">
        <form
          id="checkout-form"
          onsubmit=" event.preventDefault(); /* const myCheckout = new CheckoutProcess(); myCheckout.init(); myCheckout.checkout(this);*/"
          novalidate
        >
          <h2>Customer Information</h2>
          <!-- Hidden inline notification alert area -->
          <div id="validation-alert" class="checkout-hidden-alert" role="alert">
            Please correct the highlighted fields before checking out.
          </div>
          <label for="fname"
            >First Name <span class="required-asterisk"></span
          ></label>
          <input type="text" id="fname" name="fname" required />
          <label for="lname"
            >Last Name <span class="required-asterisk"></span
          ></label>
          <input type="text" id="lname" name="lname" required />
          <label for="street"
            >Street Address <span class="required-asterisk"></span
          ></label>
          <input type="text" id="street" name="street" required />
          <label for="city">City <span class="required-asterisk"></span></label>
          <input type="text" id="city" name="city" required />
          <label for="state"
            >State <span class="required-asterisk"></span
          ></label>
          <input type="text" id="state" name="state" required />
          <label for="zip"
            >Zip Code <span class="required-asterisk"></span
          ></label>
          <input type="text" id="zip" name="zip" required />
          <label for="cardNumber"
            >Credit Card Number <span class="required-asterisk"></span
          ></label>
          <input
            type="number"
            id="cardNumber"
            name="cardNumber"
            required
            value="1234123412341234"
          />
          <label for="expiration"
            >Expiration Date <span class="required-asterisk"></span
          ></label>
          <input type="date" id="expiration" name="expiration" required />
          <label for="code"
            >Security Code <span class="required-asterisk"></span
          ></label>
          <input type="number" id="code" name="code" required value="123" />
          <button type="submit" class="checkout-order-button">
            Checkout Order
          </button>
        </form>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
