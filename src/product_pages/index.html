<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/product.js" type="module"></script>
  </head>
  <body>
    <header class="divider">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
        <a href="/">Sleep<span class="highlight">Outside</span></a>
      </div>
      <div class="cart">
        <a href="/cart/" aria-label="View cart">
          <img src="/images/cart.svg" alt="" class="cart-icon" />
          <sup id="cart-count" aria-label="items in cart">0</sup>
        </a>
      </div>
    </header>

    <main class="divider">
      <section class="product-detail">
        <h3 id="product-brand"></h3>
        <h2 class="divider" id="product-name"></h2>
        <img id="product-image" class="divider" alt="" />
        <p id="product-price" class="product-card__price"></p>
        <p id="product-color" class="product__color"></p>
        <p id="product-description" class="product__description"></p>
        <div class="product-detail__add">
          <button id="addToCart" type="button">Add to Cart</button>
        </div>
      </section>
    </main>

    <footer>&copy;NOT a real business</footer>
  </body>
</html>
