<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cedar Ridge Rimrock 2-person tent</title>

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
        <a href="../index.html"> Sleep<span class="highlight">Outside</span></a>
      </div>

      <div class="cart">
        <a href="/cart/" aria-label="View cart">
          <img src="/images/cart.svg" alt="" class="cart-icon" />
          <sup id="cart-count" aria-label="items in cart">0</sup>
        </a>
      </div>
    </header>

    <main class="divider" id="main"></main>

    <footer>&copy;NOT a real business</footer>

    <template id="productDetailTemplate">
      <section class="product-detail">
        <h3 id="brandName"></h3>
        <h2 class="divider"></h2>
        <img id="productImage" class="divider" />

        <p class="sale-card_price"></p>
        <p class="sale-card_percent"></p>
        <p class="product-card__price"></p>

        <p class="product__color"></p>

        <p class="product__description"></p>

        <div class="product-detail__add">
          <button id="addToCart" data-id="344YJ">Add to Cart</button>
        </div>
      </section>
    </template>
  </body>
</html>
